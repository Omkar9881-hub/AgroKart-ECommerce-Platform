{% load static %}
{% include "core/base_header.html" %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Sample Order - AgroKart</title>
  <style>
body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #2e2929;
      margin-bottom: 30px;
      font-size: 2rem;
    }
    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.3s;
      margin-bottom: 20px;
    }
    .btn:hover {
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: linear-gradient(135deg, #2e2929 0%, #5a925c 100%);
    }
    .info {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
<style>body { padding-top: 70px; }</style>
  <div class="container">
    <h1>Create Sample Order</h1>
    
    <div class="info">
      <p>This will create a sample order for testing the edit/cancel functionality.</p>
      <p><strong>Edit Time Limit:</strong> 30 minutes</p>
      <p><strong>Cancel Time Limit:</strong> 2 hours</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn">Create Sample Order</button>
    </form>

    <a href="{% url 'myorders' %}" class="btn btn-secondary" style="text-decoration: none; display: block; text-align: center;">
      View My Orders
    </a>

    <a href="{% url 'home' %}" class="btn btn-secondary" style="text-decoration: none; display: block; text-align: center;">
      Back to Home
    </a>
  </div>
</body>
</html>
